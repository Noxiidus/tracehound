name: Publish to PyPI

# Builds the sdist and wheel on every version tag (always green — it just validates
# packaging) and publishes to PyPI via Trusted Publishing (OIDC), with no stored token.
#
# The publish job stays OFF until you turn it on, so a tag never produces a red failure
# before PyPI is ready. To enable, once:
#   1. On PyPI, add a trusted publisher for `tracehound` → owner Noxiidus, repo tracehound,
#      workflow `publish.yml`, environment `pypi`.
#   2. In the repo, set an Actions variable `PYPI_ENABLED` to `true`
#      (Settings → Secrets and variables → Actions → Variables).
# After that, every `v*` tag publishes automatically; you can also trigger it manually
# from the Actions tab (Run workflow).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Skipped (not failed) until PyPI trusted publishing is configured and this is set.
    if: vars.PYPI_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
