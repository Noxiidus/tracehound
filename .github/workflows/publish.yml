name: Publish to PyPI

# Builds the sdist and wheel on every version tag and publishes them to PyPI via Trusted
# Publishing (OIDC) — no API token is stored in the repository. One-time setup: on PyPI, add
# a trusted publisher for the `tracehound` project pointing at this repo and this workflow
# (Noxiidus/tracehound, workflow `publish.yml`, environment `pypi`). Until that is configured
# the publish step is the only thing that fails; the build still runs and is downloadable as
# an artifact.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
